<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register</title>
</head>

<body>

<form>
    <h2>Register</h2>

    <input
        type="text"
        id="regUsername"
        placeholder="Name"
        required
    >

    <br><br>

    <input
        type="email"
        id="regEmail"
        placeholder="Email"
        required
    >

    <br><br>

    <input
        type="password"
        id="regPassword"
        placeholder="Password"
        required
    >

    <br><br>

    <button type="submit">Register</button>
</form>

<script src="script.js"></script>

</body>
</html>
